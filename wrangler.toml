# Cloudflare Worker project configuration.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
name = "edge-blog"
compatibility_date = "2026-11-10"
compatibility_flags = ["nodejs_compat"]

# Worker 入口：API、R2 媒体代理、SEO 外壳、RSS / sitemap / robots，
# 以及「定时自动写文」的 scheduled 定时器。
main = "functions/worker.ts"

# ---------------------------------------------------------------------------
# Static assets
# Vite 把前端产物输出到 dist/，通过 assets binding 提供。
# `run_worker_first` 让所有请求先进入 Worker，由 worker.ts 决定是走 API、
# 媒体、feed、SEO 外壳还是静态资源（顺序与旧的 Pages Functions 入口一致）。
# ---------------------------------------------------------------------------
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

# ---------------------------------------------------------------------------
# Cron Trigger — 定时轮询自动化任务。
# 任务的实际执行时间由 automation_tasks.next_run_at 决定，这里只负责以固定
# 频率唤醒 Worker（Pages 不支持 Cron Trigger，这也是迁移到 Worker 的原因）。
# 5 分钟一次足以覆盖到分钟的排期精度。
# ---------------------------------------------------------------------------
[triggers]
crons = ["*/5 * * * *"]

# ---------------------------------------------------------------------------
# Bindings
# 一键部署会按这里的名字创建 D1 / R2 / KV 并把新的 ID 回填到你的仓库副本；
# 手动部署时把 ID 换成自己账号里的资源即可。
# ---------------------------------------------------------------------------

# D1 — relational data (posts, comments, settings, ...)
[[d1_databases]]
binding = "DB"
database_name = "edge-blog"
database_id = "055686f4-1e23-4d09-9036-d511d5f02de4"

# R2 — media library / image uploads
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "edge-blog-media"

# KV — config cache + rate limiting counters
[[kv_namespaces]]
binding = "CACHE"
id = "17f2c666debb4590be75cfa7d8879ede"

# Workers AI — default AI provider (no API key required inside the Worker)
[ai]
binding = "AI"

# ---------------------------------------------------------------------------
# Non-secret variables. SECRETS (JWT_SECRET, ...) must be set via
# `wrangler secret put` or the dashboard, never committed.
# ---------------------------------------------------------------------------
[vars]
ENVIRONMENT = "production"
# 站点对外地址：用于 canonical / RSS / sitemap / OG，同时自动加入 CORS / CSRF 白名单。
# 留空 = 自动跟随当前访问域名（workers.dev 与自定义域名都正确，推荐）。
# 需要固定地址时再填，例如 https://blog.example.com。
SITE_URL = ""
# 上传图片的公开前缀，**默认留空**：图片以相对路径 /media/<key> 保存，
# 链接自动跟随访问域名（换域名、绑自定义域名都无需改数据）。
# 仅当把 R2 桶绑定了独立的自定义域名（例如 https://media.example.com）时才需要设置。
# MEDIA_PUBLIC_BASE = "https://media.example.com"
# Cookie name for the admin session.
SESSION_COOKIE = "eb_session"
# Comma separated list of extra origins allowed to make credentialed CORS
# requests. Same-origin requests are always allowed; "*" is ignored on purpose
# (a wildcard plus credentials is unsafe). SITE_URL is included automatically,
# so this only needs to list *other* origins (leave empty when there are none).
ALLOWED_ORIGINS = ""

# Web search: the primary channel calls the Monid gateway (TinyFish free web
# search). Cloudflare Web Search API (AI Gateway) is the fallback when Monid is
# not configured or fails. Set SEARCH_PROVIDER for that fallback (default: exa).
# Leave these commented to use the built-in defaults.
# AI_GATEWAY_ID = "default"
# SEARCH_PROVIDER = "exa"
# SEARCH_BYOK_ALIAS = "default"
#
# Monid search gateway key (https://api.monid.ai). Save it in Admin -> AI
# settings instead, or provide it here as a secret:
#   wrangler secret put MONID_API_KEY
# MONID_API_KEY = ""
