name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # db/init.sql is what browser-only users paste into the D1 console; it
      # must always match the migrations + seed it is generated from.
      - name: SQL bundle is up to date
        run: |
          npm run db:bundle
          git diff --exit-code -- db/init.sql

      - name: Lint
        run: npm run lint

      # `build` already runs typecheck; run it explicitly for a clearer failure.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

# 部署由 Cloudflare Workers Builds 完成（Worker → Settings → Builds 连接本仓库），
# push 到 main 后自动构建并 `wrangler deploy`，无需在本仓库保存 Cloudflare API Token。
